<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportHub - Shopping Cart</title>
    <link rel="stylesheet" th:href="@{/cart/style.css}">
</head>
<body>

    <div class="page-wrapper">
        <!-- VIEW 1: CART SUMMARY -->
        <main id="cart-view" class="card-container">
            <header class="header-bar">
                <a th:href="@{/}" class="nav-btn" aria-label="Go to Homepage">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </a>
                <h1>Cart Summary</h1>
            </header>

            <!-- Banner di notifica integrato per Successo o Errore -->
            <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert-banner alert-error" th:text="${errorMessage}"></div>

            <section class="table-container">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th class="align-left">Product List</th>
                            <th>Quantity</th>
                            <th>Cost</th>
                            <th>Discount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                        <!-- Ciclo Thymeleaf per mostrare i prodotti nel carrello -->
                        <tr th:each="item : ${cartItems}">
                            <td class="align-left" th:text="${item.product.name}">Nome Prodotto</td>
                            <td th:text="${item.quantity}">1</td>
                            <td th:text="'$ ' + ${item.product.price}">€ 0.00</td>
                            <td>€ 0.00</td>
                            <td>
                                <!-- Form per rimuovere il singolo prodotto -->
                                <form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn-remove" style="background:none; border:none; color:red; cursor:pointer;">Remove</button>
                                </form>
                            </td>
                        </tr>
                        
                        <!-- Messaggio se il carrello è vuoto -->
                        <tr th:if="${cartItems == null or cartItems.isEmpty()}">
                            <td colspan="5" style="text-align: center; padding: 20px;">Your cart is empty.</td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <div class="summary-actions">
                <div class="subtotal-badge">
                    <span>Subtotal</span>
                    <!-- Mostra il totale calcolato dal controller -->
                    <strong id="subtotal-amount" th:text="'€ ' + ${totalAmount}">€ 0.00</strong>
                </div>
                <!-- Link Thymeleaf verso la pagina dedicata al checkout -->
                <a th:href="@{/cart/checkout}" class="btn btn-primary">Proceed to Checkout</a>
            </div>

            <footer class="contact-footer">
                <a th:href="@{/contact}">Having a problem? Contact Us</a>
            </footer>
        </main>
    </div>

</body>
</html>
