<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportHub - Shopping Cart & Checkout</title>
    <link rel="stylesheet" th:href="@{/cart/style.css}">
</head>
<body>

    <div class="page-wrapper">
        <!-- VIEW 1: CART SUMMARY -->
        <main id="cart-view" class="card-container">
            <header class="header-bar">
                <a th:href="@{/}"  class="nav-btn" aria-label="Go to Homepage">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </a>
                <h1>Cart Summary</h1>
                <div class="user-avatar"></div>
            </header>

            <section class="table-container">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th class="align-left">Product List</th>
                            <th>Quantity</th>
                            <th>Cost</th>
                            <th>Discount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                        <!-- Dynamically generated via JS -->
                    </tbody>
                </table>
            </section>

            <div class="summary-actions">
                <div class="subtotal-badge">
                    <span>Subtotal</span>
                    <strong id="subtotal-amount">$ 0.00</strong>
                </div>
                <button class="btn btn-primary" onclick="showCheckout()">Proceed to Checkout</button>
            </div>

            <footer class="contact-footer">
                <a th:href="@{/contact}">Contact Information</a>
            </footer>
        </main>

        <!-- VIEW 2: CHECKOUT SCREEN -->
        <main id="checkout-view" class="card-container hidden">
            <header class="header-bar">
                <button class="nav-btn" onclick="showCart()" aria-label="Back to Cart">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <h1>Confirm Purchase</h1>
                <div class="user-avatar"></div>
            </header>

            
            <form id="checkout-form" th:action="@{/cart/{id}/checkout(id=${buyerId})}" method="post"></form>
                <div class="checkout-grid">
                    <div class="checkout-fields">
                        <div class="field-group">
                            <label for="address">Shipping Address</label>
                            <input type="text" id="address" placeholder="e.g. 123 Main Street, City" required>
                        </div>

                        <div class="field-group">
                            <label for="recipient">Recipient Name</label>
                            <input type="text" id="recipient" placeholder="Full name of recipient" required>
                        </div>

                        <div class="field-group">
                            <label for="shipping-type">Delivery Method</label>
                            <select id="shipping-type" onchange="updateTotal()">
                                <option value="standard">Standard Delivery ($ 5.00)</option>
                                <option value="premium">Express Delivery ($ 10.00)</option>
                            </select>
                        </div>

                        <div class="payment-section">
                            <h3>Payment Method</h3>
                            <div class="radio-option">
                                <input type="radio" id="pay-online" name="payment-method" value="online" checked onchange="toggleCardDetails(true)">
                                <label for="pay-online">Online Credit Card</label>
                            </div>
                            
                            <div id="card-details-box" class="card-input-box">
                                <div class="field-group">
                                    <input type="text" placeholder="Card Number (xxxx-xxxx-xxxx-xxxx)" maxlength="19">
                                </div>
                                <div class="flex-row">
                                    <input type="text" placeholder="MM/YY" maxlength="5">
                                    <input type="text" placeholder="CVV" maxlength="3">
                                </div>
                            </div>

                            <div class="radio-option">
                                <input type="radio" id="pay-cod" name="payment-method" value="cod" onchange="toggleCardDetails(false)">
                                <label for="pay-cod">Cash on Delivery</label>
                            </div>
                        </div>
                    </div>

                    <div class="checkout-sidebar">
                        <div class="total-badge">
                            <span>Final Total</span>
                            <h2 id="final-total">$ 0.00</h2>
                        </div>
                        <button type="submit" class="btn btn-success btn-confirm">Confirm Purchase</button>
                    </div>
                </div>
            </form>

            <footer class="contact-footer">
                <a th:href="@{/contact}">Contact Information</a>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
