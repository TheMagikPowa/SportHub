<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Post - SportHub</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Hub Stylesheet -->
    <link rel="stylesheet" th:href="@{/hub/style.css}">
</head>
<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="header-container">
            <!-- Back Button -->
            <a th:href="@{/hub}" class="back-btn" title="Back to Hub">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <!-- Page Title -->
            <h1 class="header-title">Create New Post</h1>

            <div style="width: 40px;"></div> <!-- Spacer to balance header layout -->
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="hub-main">
        <div class="create-post-card">
            
            <form th:action="@{/hub/save-post}" th:object="${event}" method="post" class="post-form">
    
    <!-- CAMPO NASCOSTO PER IL BUYER ID (Necessario perché nullable = false) -->
    <!-- Nota: se non hai ancora un sistema di login dinamico, puoi mettergli un valore di test come "1" -->
                <input type="hidden" name="buyerId" value="1" />

            
                <div class="form-group">
                    <label for="event-title" class="form-label">Event Title</label>
                    <input type="text" id="event-title" th:field="*{eventTitle}" class="form-input" placeholder="Event Title..." required>
                </div>

            
                <div class="form-group">
                    <label for="event-desc" class="form-label">Event Description</label>
                    <textarea id="event-desc" th:field="*{message}" class="form-textarea" rows="6" placeholder="Provide event details, time, location, and requirements..." required></textarea>
                </div>

                <!--aggiunta dei campi obbligatori lato db-->
                
                <div class="form-group">
                    <label for="event-date" class="form-label">Event Date</label>
                    <input type="date" id="event-date" th:field="*{eventDate}" class="form-input" required>
                </div>

            
                <div class="form-group">
                    <label for="event-type" class="form-label">Event Type</label>
                    <select id="event-type" th:field="*{type}" class="form-input" required>
                        <option value="">Select type...</option>
                        <!-- Se usi i valori dell'enum direttamente: -->
                        <option th:each="eventType : ${T(com.generation.SportHub.entity.enums.EventType).values()}" 
                                th:value="${eventType}" 
                                th:text="${eventType}">
                        </option>
                    </select>
                </div>

            
                <div class="form-actions">
                    <button type="submit" class="btn-submit">Publish</button>
                </div>

            </form>

        </div>
    </main>

</body>
</html>
