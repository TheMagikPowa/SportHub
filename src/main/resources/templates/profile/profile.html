<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Info - SportHub</title>
    <link rel="icon" type="image/png" th:href="@{/res/logo.png}">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Profile Stylesheet -->
    <link rel="stylesheet" th:href="@{/profile/style.css}">
</head>
<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="header-container">
            <!-- Back Button -->
            <a th:href="@{/}" class="back-btn" title="Back to Home">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <!-- Page Title -->
            <h1 class="header-title">Profile Info</h1>

            <!-- Top Right Avatar Icon -->
            
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="profile-main">
        <div class="profile-card" th:object="${personDTO}">
            
            <!-- Profile Image Circle -->
            <div class="profile-avatar-large">
                <i class="fa-solid fa-user"></i>
            </div>

            <!-- User Info List (Dati dinamici corretti) -->
            <div class="info-list">
                <div class="info-item">
                    <span class="info-label">Mail:</span>
                    <span class="info-value" th:text="*{email}">user@example.com</span>
                </div>
                <div class="info-item">
                    <span class="info-label">First Name:</span>
                    <span class="info-value" th:text="*{name}">Mario</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Last Name:</span>
                    <span class="info-value" th:text="*{surname}">Rossi</span>
                </div>
                <div class="info-item">
                    <span class="info-label">DoB:</span>
                    <span class="info-value" th:text="*{dob}">01/01/1995</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Gender:</span>
                    <span class="info-value" th:text="*{gender}">Male</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Role:</span>
                    <span class="info-value" th:text="*{role}">BUYER</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <form th:action="@{/profile/delete}" method="post" onsubmit="return confirm('Are you sure you want to delete your account? This action cannot be undone.');" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-delete">Delete Profile</button>
                </form>
                
                <!-- Il link passa dinamicamente l'ID dell'utente al form di modifica -->
                <a th:href="@{/profile/update}" class="btn btn-modify">Modify Data</a>
            </div>

            
    

        </div>
    </main>

</body>
</html>
