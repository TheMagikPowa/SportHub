<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - SportHub</title>
    <link rel="icon" type="image/png" th:href="@{/res/logo.png}">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Profile Stylesheet -->
    <link rel="stylesheet" th:href="@{/profile/style.css}">

    <!-- Stile aggiuntivo locale per adattare gli input di modifica alla card esistente -->
    <style>
        .form-input, .form-select {
            width: 100%;
            background: var(--forest-soft);
            border: 1px solid rgba(244, 239, 225, 0.3);
            color: var(--cream);
            padding: 6px 10px;
            border-radius: 4px;
            font-family: var(--body);
            font-size: 1rem;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--leaf);
        }
        .info-item {
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Sfondo geometrico SVG -->
    <svg class="hero-lanes-bg" viewBox="0 0 1200 700" preserveAspectRatio="none" aria-hidden="true">
      <path d="M -100 120 L 260 120 L 400 40 L 520 210 L 660 120 L 1300 120" stroke="#2d5a3d" stroke-width="4" fill="none" opacity="0.12" />
      <path d="M -100 320 L 300 320 L 440 250 L 560 400 L 700 320 L 1300 320" stroke="#7cb342" stroke-width="3" fill="none" opacity="0.14" />
      <path d="M -100 540 L 280 540 L 420 470 L 540 610 L 690 540 L 1300 540" stroke="#2d5a3d" stroke-width="4" fill="none" opacity="0.1" />
    </svg>

    <header class="header">
        <div class="header-container">
            <!-- Back Button to Detail -->
            <a th:href="@{/dashboard/show-dashboard}" class="back-btn" title="Back to Dashboard">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <!-- Page Title -->
            <h1 class="header-title">Edit Profile</h1>

            <!-- Spacer per bilanciare il flexbox e centrare il titolo -->
            <div class="header-spacer"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="profile-main">
        <div class="profile-card">
            
            <!-- Profile Image Circle -->
            <div class="profile-avatar-large">
                <i class="fa-solid fa-user"></i>
            </div>

            <!-- Form di Modifica (Invia i dati al POST /profile/update senza ID nell'URL) -->
            <form th:action="@{/profile/save-update}" th:object="${personDTO}" method="post" style="width: 100%;">
                
                <!-- Token CSRF obbligatorio per Spring Security -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" th:field="*{email}" />
                <input type="hidden" th:field="*{username}" />
                <input type="hidden" th:field="*{role}" />
                <!-- User Info List -->
                <div class="info-list">
                    <!-- Email (Sola lettura per sicurezza) -->
                    <div class="info-item">
                        <span class="info-label">Mail:</span>
                        <span class="info-value" th:text="*{email}" style="opacity: 0.8;">user@example.com</span>
                    </div>

    

                    <!-- First Name (Modificabile) -->
                    <div class="info-item">
                        <span class="info-label">First Name:</span>
                        <span class="info-value" style="flex-grow: 1;">
                            <input type="text" th:field="*{name}" class="form-input" required />
                        </span>
                    </div>

                    <!-- Last Name (Modificabile) -->
                    <div class="info-item">
                        <span class="info-label">Last Name:</span>
                        <span class="info-value" style="flex-grow: 1;">
                            <input type="text" th:field="*{surname}" class="form-input" required />
                        </span>
                    </div>

                    <!-- DoB (Modificabile) -->
                    <div class="info-item">
                        <span class="info-label">DoB:</span>
                        <span class="info-value" style="flex-grow: 1;">
                            <input type="date" th:field="*{dob}" class="form-input" required />
                        </span>
                    </div>

                    <!-- Gender (Modificabile tramite select) -->
                    <div class="info-item">
                        <span class="info-label">Gender:</span>
                        <span class="info-value" style="flex-grow: 1;">
                            <select th:field="*{gender}" class="form-select">
                                <option value="M">M</option>
                                <option value="F">F</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </span>
                    </div>

                    <!-- Role (Sola lettura) -->
                    <div class="info-item">
                        <span class="info-label">Role:</span>
                        <span class="info-value" th:text="*{role}" style="opacity: 0.8;">BUYER</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <a th:href="@{/dashboard/show-dashboard}" class="btn btn-delete" style="text-decoration: none; display: inline-block; text-align: center;">Cancel</a>
                    <button type="submit" class="btn btn-modify">Save Changes</button>
                </div>

            </form>

            <!-- Footer Section -->
            <footer>
                <div class="wrap" style="padding: 10px 0;">
                  <div class="footer-bottom" style="text-align: center; font-size: 0.85rem; color: var(--cream-dim);">
                    <span>© 2026 Sporthub — Edit Mode</span>
                  </div>
                </div>
            </footer>

        </div>
    </main>

</body>
</html>
